<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調到沒拍音｜TCMC</title>
<style>
  :root{
    --charcoal:#2E3A3F;
    --charcoal-2:#232C30;
    --charcoal-3:#20292D;
    --teal:#0B6E6E;
    --teal-bright:#2FBFAA;
    --gold:#E8A33D;
    --green:#33D17A;
    --amber:#F2B84B;
    --paper:#EAF2F1;
    --muted:#8FA3A0;
    --danger:#E2685A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 20% -10%, #33424A 0%, var(--charcoal) 55%, #232C30 100%);
    color:var(--paper);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px;}

  header{margin-bottom:22px;}
  .header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .lang-btn{
    padding:6px 14px;border-radius:20px;border:1.5px solid rgba(234,242,241,0.2);
    background:rgba(255,255,255,0.03);color:var(--paper);font-size:12.5px;font-weight:700;
    cursor:pointer;letter-spacing:.05em;transition:all .15s ease;flex:none;
  }
  .lang-btn:hover{border-color:var(--teal-bright);color:#fff;}
  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--teal-bright);
    font-weight:700;text-transform:uppercase;margin-bottom:6px;
  }
  h1{
    font-family:"Noto Serif TC",serif;
    font-size:clamp(24px,4vw,32px);
    margin:0 0 6px;font-weight:700;color:#fff;letter-spacing:.02em;
  }
  .sub{color:var(--muted);font-size:14px;line-height:1.6;max-width:640px;}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    border:1px solid rgba(234,242,241,0.09);
    border-radius:14px;padding:18px 20px;margin-bottom:16px;
  }
  .card h2{
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;font-weight:700;
  }

  .oct-toggle{display:flex;gap:10px;margin-bottom:12px;}
  .oct-btn{
    flex:1;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(234,242,241,0.15);
    background:rgba(255,255,255,0.02);color:var(--paper);font-size:14px;font-weight:600;
    cursor:pointer;transition:all .15s ease;text-align:center;
  }
  .oct-btn small{display:block;font-weight:400;color:var(--muted);margin-top:2px;font-size:11.5px;}
  .oct-btn.active{
    background:rgba(47,191,170,0.14);border-color:var(--teal-bright);color:#fff;
    box-shadow:0 0 0 1px rgba(47,191,170,0.25) inset;
  }

  .key-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .key-btn{
    padding:10px 4px;border-radius:9px;border:1.5px solid rgba(234,242,241,0.13);
    background:rgba(255,255,255,0.02);color:var(--paper);font-size:14px;font-weight:600;
    cursor:pointer;transition:all .15s ease;
  }
  .key-btn.active{
    background:rgba(232,163,61,0.16);border-color:var(--gold);color:#fff;
    box-shadow:0 0 0 1px rgba(232,163,61,0.3) inset;
  }

  .transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .btn{
    padding:12px 20px;border-radius:10px;border:none;font-size:14.5px;font-weight:700;
    cursor:pointer;transition:transform .1s ease, opacity .15s ease;letter-spacing:.02em;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal-bright);color:#0d1f1d;}
  .btn-stop{background:var(--danger);color:#2b0d09;}
  .btn-ghost{background:rgba(255,255,255,0.06);color:var(--paper);border:1px solid rgba(234,242,241,0.18);}
  .btn-ghost.on{background:rgba(232,163,61,0.22);border-color:var(--gold);color:#fff;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}

  .status-line{
    margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
  .dot.ok{background:var(--green);box-shadow:0 0 8px var(--green);}

  .slider-row{display:flex;align-items:center;gap:10px;margin-top:18px;}
  .nudge-btn{
    flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(234,242,241,0.18);
    background:rgba(255,255,255,0.05);color:var(--paper);font-size:19px;font-weight:700;
    cursor:pointer;transition:all .12s ease;line-height:1;
  }
  .nudge-btn:active{background:rgba(47,191,170,0.2);border-color:var(--teal-bright);}

  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:48px;background:transparent;cursor:pointer;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:8px;border-radius:4px;
    background:rgba(143,163,160,0.3);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;
    background:var(--teal-bright);border:3px solid #0d1f1d;margin-top:-13px;
    box-shadow:0 0 10px rgba(47,191,170,0.5);
  }
  input[type=range]::-moz-range-track{
    height:8px;border-radius:4px;
    background:rgba(143,163,160,0.3);
  }
  input[type=range]::-moz-range-thumb{
    width:30px;height:30px;border-radius:50%;
    background:var(--teal-bright);border:3px solid #0d1f1d;
    box-shadow:0 0 10px rgba(47,191,170,0.5);
  }

  .result{
    display:none;margin-top:16px;border-radius:10px;padding:14px 16px;
    border-left:3px solid var(--teal-bright);background:rgba(255,255,255,0.04);
  }
  .result.show{display:block;}
  .result .verdict{font-size:17px;font-weight:700;color:#fff;margin-bottom:4px;}
  .result .verdict.ok{color:var(--green);}
  .result .detail{font-size:13.5px;color:var(--muted);line-height:1.6;}
  .ab-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .ab-btn{
    flex:1;min-width:130px;padding:12px 10px;border-radius:10px;
    border:1.5px solid rgba(234,242,241,0.18);background:rgba(255,255,255,0.05);
    color:var(--paper);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s ease;
  }
  .ab-btn.on{background:rgba(232,163,61,0.22);border-color:var(--gold);color:#fff;}

  .pitch-wrap{margin-top:14px;}
  .pitch-wrap canvas{width:100%;height:150px;display:block;border-radius:10px;background:rgba(255,255,255,0.04);}
  .line-toggle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--paper);cursor:pointer;}
  .line-toggle input{width:18px;height:18px;accent-color:var(--teal-bright);}
  .adv{margin-top:14px;border:1px solid rgba(143,163,160,0.3);border-radius:10px;padding:8px 12px;}
  .adv summary{cursor:pointer;font-size:13.5px;color:var(--muted);}
  .adv-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;flex-wrap:wrap;}
  .adv-row label{flex:0 0 100%;}
  .adv-row input[type=range]{flex:1;min-width:140px;accent-color:var(--teal-bright);}
  .adv-row select{font-size:14px;padding:6px 8px;border-radius:8px;}
  .adv-val{min-width:70px;text-align:right;font-variant-numeric:tabular-nums;}
  .note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:4px;}
  .progress{height:6px;border-radius:3px;background:rgba(143,163,160,0.3);overflow:hidden;}
  .progress>div{height:100%;width:0%;background:var(--teal-bright);transition:width .1s linear;}

  footer{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8;}
  footer a{color:var(--teal-bright);}

  @media (max-width:640px){
    .wrap{padding:14px 10px 32px;}
    .card{padding:12px 14px;margin-bottom:10px;}
    h1{font-size:20px;}
    .sub{font-size:12.5px;}
    .oct-btn{padding:9px 8px;font-size:13px;}
    .oct-btn small{font-size:10.5px;}
    .key-btn{padding:8px 3px;font-size:13px;}
    .btn{padding:10px 14px;font-size:13.5px;}
    .nudge-btn{width:42px;height:42px;font-size:17px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-top">
      <div class="eyebrow" id="txtEyebrow">TCMC · 練唱室 Practice Room</div>
      <button class="lang-btn" id="btnLang" onclick="toggleLang()">EN</button>
    </div>
    <h1 id="txtH1">調到沒拍音</h1>
    <div class="sub" id="txtSub"></div>
  </header>

  <div class="card">
    <h2 id="txtPracTitle">選練習</h2>
    <div class="oct-toggle" id="pracToggle" style="margin-bottom:0;">
      <button class="oct-btn active" id="btnPracUnison" onclick="setPractice('unison')"></button>
      <button class="oct-btn" id="btnPracOctave" onclick="setPractice('octave')"></button>
      <button class="oct-btn" id="btnPracFifth" onclick="setPractice('fifth')"></button>
      <button class="oct-btn" id="btnPracFourth" onclick="setPractice('fourth')"></button>
    </div>
  </div>

  <div class="card">
    <h2 id="txtPickTitle">選一個音</h2>
    <div class="oct-toggle" id="octToggle"></div>
    <div class="key-grid" id="keyGrid"></div>
  </div>

  <div class="card">
    <div class="oct-toggle" id="modeToggle">
      <button class="oct-btn active" id="btnModeSlider" onclick="setMode('slider')"></button>
      <button class="oct-btn" id="btnModeSing" onclick="setMode('sing')"></button>
    </div>
    <div id="sliderPanel">
    <div class="transport">
      <button class="btn btn-primary" id="btnPlay" onclick="togglePlay()">開始聆聽</button>
      <button class="btn btn-primary" id="btnConfirm" onclick="confirmAnswer()" disabled>確定</button>
      <button class="btn btn-ghost" id="btnNext" onclick="nextRound()" style="display:none">再來一次</button>
      <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
    </div>
    <div class="slider-row">
      <button class="nudge-btn" id="btnDown" onclick="nudge(-1)" aria-label="lower">−</button>
      <input type="range" id="tuneSlider" min="0" max="1000" step="1" value="500">
      <button class="nudge-btn" id="btnUp" onclick="nudge(1)" aria-label="raise">+</button>
    </div>
    <div class="note" id="txtHint"></div>
    <div class="result" id="resultBox">
      <div class="verdict" id="verdictText"></div>
      <div class="detail" id="detailText"></div>
      <div class="ab-row" id="abRow">
        <button class="ab-btn" id="btnAbYours" onclick="playCompare('yours')"></button>
        <button class="ab-btn" id="btnAbCorrect" onclick="playCompare('correct')"></button>
      </div>
      <div class="note" id="overtoneNote" style="margin-top:12px;"></div>
    </div>
    </div>
    <div id="singPanel" style="display:none;">
      <div class="note" id="txtSingInstruction" style="margin-bottom:14px;"></div>
      <div class="transport">
        <button class="btn btn-primary" id="btnSing" onclick="toggleSing()"></button>
        <div class="status-line"><span class="dot" id="singDot"></span><span id="singLive"></span></div>
      </div>
      <label class="line-toggle"><input type="checkbox" id="chkLine" onchange="onLineToggle()"><span id="txtLineToggle"></span></label>
      <div class="pitch-wrap" id="pitchWrap"><canvas id="pitchCanvas"></canvas></div>
      <button class="btn btn-ghost" id="btnDiagReport" onclick="downloadDiagReport()" style="margin-top:8px;"></button>
      <details class="adv" id="advBox">
        <summary id="advTitle"></summary>
        <div class="adv-row"><label id="advRangeL" for="advRange"></label><input type="range" id="advRange" oninput="onAdv()"><span class="adv-val" id="advRangeV"></span></div>
        <div class="adv-row"><label id="advSmoothL" for="advSmooth"></label><select id="advSmooth" onchange="onAdv()"></select></div>
        <div class="adv-row"><label id="advRatioL" for="advRatio"></label><input type="range" id="advRatio" oninput="onAdv()"><span class="adv-val" id="advRatioV"></span></div>
        <button class="btn btn-ghost" id="advReset" onclick="resetAdv()" style="margin-top:10px"></button>
        <div class="note" id="advNote"></div>
      </details>
      <div class="progress" style="margin-top:14px;"><div id="singProgress"></div></div>
      <div class="result" id="singResult">
        <div class="verdict" id="singVerdict"></div>
        <div class="detail" id="singDetail"></div>
      </div>
    </div>
  </div>

  <footer>
    <span id="txtFooter1"></span><br>
    <span id="txtFooter2">台灣合唱音樂中心製作 · Harmony Ears</span><br>
    <span style="opacity:.5;"><span id="txtVersionPrefix">App 版本：</span>v2.7</span><br>
    <span>© 2026 TCMC · <a href="https://creativecommons.org/licenses/by-nc/4.0/" style="color:inherit">CC BY-NC 4.0</a> · 教學使用不限收費，詳見 <a href="https://tcmctw.github.io/" style="color:inherit">tcmctw.github.io</a></span>
  </footer>

</div>

<script id="app">
/* ================= CONFIG ================= */
const CONFIG = {
  A4: 440,                     // 調音基準 tuning reference (Hz)
  OCTAVES: [2, 3, 4],          // 三個八度 three octave choices (C2–B2, C3–B3, C4–G4;固定音域 fixed range C2–G4)
  OCTAVE_NOTE_CAP: { 4: 7 },     // 最高八度是部分八度:只到 G4(音名索引 7),不出現 G♯4–B4 top octave is partial: up to G4 (note index 7); G♯4–B4 hidden
  PARTIALS: [1, 0.5, 0.34, 0.24, 0.26, 0.24], // 泛音振幅 harmonic amplitudes (partial 1..6); v1.1 加強第 5、6 泛音 boosted partials 5+6
  ADJ_GAIN_DB: { fifth: -4 }, // 滑桿模式「可調音」(目標音)相對固定音的音量,dB;只有列出的練習套用,其他為 0。五度 -4 dB 是 Ray 聽過比較樣本後選的 v2.7 slider mode: level of the adjustable (target) voice vs the fixed tone, in dB; only listed practices, others 0 dB. Fifth -4 dB chosen by Ray after a listening comparison
  VOICE_GAIN: 0.55,            // 每個聲部音量 per-voice gain
  MASTER_GAIN: 0.5,            // 總音量 master gain
  SLIDER_STEPS: 1000,          // 滑桿總格數 slider resolution
  MAX_CENTS: 140,              // 滑桿較遠一端涵蓋的最大偏差 max cents covered at the farther slider end
  CENTER_MIN: 0.30,            // 零點位置的隨機範圍(佔滑桿比例) zero-point random range, fraction of track
  CENTER_MAX: 0.70,
  CENTER_EXCLUDE: 0.06,        // 零點避開正中央的範圍 keep zero point this far from exact slider center
  START_MIN_CENTS: 25,         // 起始位置至少偏離 start position at least this many cents off
  TOLERANCE_CENTS: 2,          // 判定對齊的容差 success tolerance (±cents)
  GLIDE_SEC: 0.03,             // 滑桿音高滑動時間常數 pitch glide time constant (s)
  FADE_SEC: 0.25,              // 起音/停止淡入淡出 fade in/out (s)
  /* ---- 唱歌模式 sing mode ---- */
  SING_TOLERANCE_CENTS: 15, // 人聲音準容差:綠色帶半寬 ±cent,帶內即準,畫面與計分同一標準。15 是猜的,靠耳朵調 pass tolerance: green band half-width in cents; inside the band = in tune, one standard for display and scoring. 15 is a guess, tune by ear

   (齊唱 1、八度 1、五度 2、四度 3):拍音 = beatK × |實際音高 − 目標音高|
   the four practices. ratio = just-intonation ratio of the adjustable tone above the fixed low tone.
   beatK converts the adjustable tone's Hz error into beats/s at the first coincident partial pair
   (= the adjustable tone's partial number in that pair: unison 1, octave 1, fifth 2, fourth 3):
   beat rate = beatK x |actual - target| */

  unison: { ratio: 1,   beatK: 1 },
  octave: { ratio: 2,   beatK: 1 },

/* ================= AUDIO ================= */
let ctx = null, master = null, refVoice = null, adjVoice = null;
/* 唱歌模式內部狀態 sing mode internals */
let singIdleTimer = null;
let singStream = null, singSource = null, singAnalyser = null, singBuf = null;
let singMonitor = null, singTrace = [], singCentsNow = null;
let singTimer = null, singSession = null, singTarget = 0, singStartMs = 0;

function ensureCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); // 最低延遲 lowest practical latency
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    ctx.onstatechange = () => { if(ctx.state === 'suspended' || ctx.state === 'interrupted'){ try{ ctx.resume(); }catch(e){} } };
  }
  if(ctx.state === 'suspended'){ ctx.resume(); }
}

function makeVoice(level){
  const bus = ctx.createGain();
  bus.gain.value = CONFIG.VOICE_GAIN * (level === undefined ? 1 : level);
  bus.connect(master);
  const oscs = CONFIG.PARTIALS.map((amp, i) => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    const og = ctx.createGain();
    og.gain.value = amp;
    o.connect(og); og.connect(bus);
    o.start();
    return o;
  });
  return {
    oscs,
    setFreq(f, glide){
      const now = ctx.currentTime;
      oscs.forEach((o, i) => {
        const target = f * (i + 1);
        if(glide){ o.frequency.setTargetAtTime(target, now, CONFIG.GLIDE_SEC); }
        else { o.frequency.setValueAtTime(target, now); }
      });
    },
    stop(){
      oscs.forEach(o => { try{ o.stop(); }catch(e){} });
      setTimeout(() => bus.disconnect(), 100);
    }
  };
}

function noteFreq(octave, noteIdx){
  // 十二平均律,A4=440 equal temperament
  const midi = (octave + 1) * 12 + noteIdx;
  return CONFIG.A4 * Math.pow(2, (midi - 69) / 12);
}
function centsToRatio(cents){ return Math.pow(2, cents / 1200); }
// 拍音上限(每秒次數 = 與目標音的頻率差)換算成該音高的 ±cent;同樣的拍音,音越高 cent 越窄
// max beating (beats/s = Hz difference from target) as a ±cent band at a given pitch: the same beat rate is a narrower cents band on higher notes
function beatsToCents(beats, targetHz){ return 1200 * Math.log2((targetHz + beats) / targetHz); }
function currentNoteName(){ return NOTE_NAMES[state.noteIdx] + CONFIG.OCTAVES[state.octaveIdx]; }
// 目標音(要調/唱的音)最接近的十二平均律音名 nearest note name of the adjustable target tone
function targetNoteName(){
  const m = Math.round(69 + 12 * Math.log2(currentTargetFreq() / CONFIG.A4));
  return NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
}
// 設定說明裡用的名稱,例:齊唱 C4、五度 C4→G4 label used in settings/help text
function practiceTargetName(){
  const ref = currentNoteName();
  const p = t('prac')[state.practice];
  return state.practice === 'unison' ? (p.short + ' ' + ref) : (p.short + ' ' + ref + '→' + targetNoteName());
}
function currentTolCents(){ return SET.tolCents; } // 容差 = 綠色帶 ±cent,所有練習同一標準 tolerance = green band ±cents, same standard across practices

/*TESTABLE-START*/
// 音高偵測:NSDF(McLeod 法),取「第一個達最高峰 K 倍以上的峰」,不易跳到泛音。方法與參數來自 Ray 的 Harmony Ears 系列(harmony-ears-third/seventh)
// 搜尋範圍預設為目標音的 SING_SEARCH_LOW_RATIO..SING_SEARCH_HIGH_RATIO 倍,涵蓋上下八度,所以唱錯八度仍會被量到(算錯);範圍外的聲音當作無聲
// pitch detection: NSDF (McLeod method), first peak within K of the highest peak, resistant to harmonic/octave-up errors. Method and constants from Ray's Harmony Ears apps.
// Search range defaults to SING_SEARCH_LOW_RATIO..SING_SEARCH_HIGH_RATIO x target (covers an octave below and above), so an octave-off note is still measured and counts as wrong; sound outside the range is treated as unvoiced
let detectInfo = { rms: 0, clarity: null, hz: null, reason: '' };
function detectPitch(buf, sampleRate, minHz, maxHz, minRms){
  minHz = minHz || CONFIG.SING_MIN_HZ;
  maxHz = maxHz || CONFIG.SING_MAX_HZ;
  minRms = (minRms === undefined) ? CONFIG.SING_RMS_MIN : minRms;
  detectInfo = { rms: 0, clarity: null, hz: null, reason: '' };
  const SIZE = buf.length;
  let mean = 0;
  for(let i = 0; i < SIZE; i++){ mean += buf[i]; }
  mean /= SIZE;                                  // 去除直流偏移 remove DC offset
  let rms = 0;
  for(let i = 0; i < SIZE; i++){ const v = buf[i] - mean; rms += v * v; }
  rms = Math.sqrt(rms / SIZE);
  detectInfo.rms = rms;
  if(rms < minRms){ detectInfo.reason = 'quiet'; return null; }
  const minLag = Math.max(2, Math.floor(sampleRate / maxHz));
  const maxLag = Math.min(Math.floor(sampleRate / minHz), SIZE - 2);
  if(maxLag <= minLag + 1){ detectInfo.reason = 'range'; return null; }
  const nsdf = new Float32Array(maxLag + 2);
  for(let lag = minLag; lag <= maxLag; lag++){
    let acf = 0, m = 0;
    const limit = SIZE - lag;
    for(let i = 0; i < limit; i++){ const a = buf[i] - mean, b = buf[i + lag] - mean; acf += a * b; m += a * a + b * b; }
    nsdf[lag] = m > 0 ? 2 * acf / m : 0;
  }
  const peaks = [];
  let globalMax = 0;
  for(let lag = minLag + 1; lag < maxLag; lag++){
    if(nsdf[lag - 1] <= nsdf[lag] && nsdf[lag] >= nsdf[lag + 1] && nsdf[lag] > 0){
      peaks.push(lag);
      if(nsdf[lag] > globalMax){ globalMax = nsdf[lag]; }
    }
  }
  if(!peaks.length){ detectInfo.reason = 'nopeak'; return null; }
  let chosen = -1;
  for(const p of peaks){ if(nsdf[p] >= CONFIG.SING_PEAK_K * globalMax){ chosen = p; break; } }
  if(chosen < 0){ detectInfo.reason = 'nopeak'; return null; }
  const clarity = nsdf[chosen];
  detectInfo.clarity = clarity;
  if(clarity < CONFIG.SING_CLARITY_MIN){ detectInfo.reason = 'unclear'; return null; }
  const y1 = nsdf[chosen - 1], y2 = nsdf[chosen], y3 = nsdf[chosen + 1];
  const den = y1 - 2 * y2 + y3;
  const shift = den !== 0 ? 0.5 * (y1 - y3) / den : 0;
  detectInfo.hz = sampleRate / (chosen + shift);
  detectInfo.reason = 'ok';
  return detectInfo.hz;
}


// 跳變確認(取自 Harmony Ears):與上一個已確認音高差超過 SING_JUMP_CENTS 的讀數,要連續 SING_JUMP_CONFIRM 個 frame 都落在同一處才採信。
// 與原版不同:未確認的 frame 回傳 null(無聲,畫面上是缺口),不沿用上一個音高,所以不會偷偷把錯的算成對;真的唱到另一個八度,確認後照實記錄為錯。
// jump confirmation (from Harmony Ears): a reading more than SING_JUMP_CENTS from the last confirmed pitch must repeat SING_JUMP_CONFIRM consecutive frames at the same place before it is trusted.
// Unlike the original, unconfirmed frames return null (a gap), never the previous pitch, so nothing is silently counted as in tune; a real octave change is recorded as wrong once confirmed.
function createSmoother(){
  let last = null, cand = null, streak = 0;
  return function(freq){
    if(freq === null){ return null; }
    const c = 1200 * Math.log2(freq);
    if(last === null || Math.abs(c - last) <= CONFIG.SING_JUMP_CENTS){ last = c; cand = null; streak = 0; return freq; }
    if(cand !== null && Math.abs(c - cand) < CONFIG.SING_JUMP_CENTS / 2){ streak++; cand = c; } else { cand = c; streak = 1; }
    if(streak >= CONFIG.SING_JUMP_CONFIRM){ last = c; cand = null; streak = 0; return freq; }
    detectInfo.reason = 'jump';
    return null;
  };
}

// 依 CONFIG 計分 score singing frames; frame = {t: seconds since onset, voiced, inTune}
function scoreFrames(frames, targetHz){
  const counted = frames.filter(f => f.voiced && f.t >= CONFIG.SING_SETTLE_SEC);
  const inTune = counted.filter(f => Math.abs(f.cents) <= SET.tolCents).length; // 容差 = 綠色帶 ±cent,帶內即準;按停止時以最終設定計算 tolerance = green band ±cents; inside counts as in tune; value at Stop decides
  // sharp/flat 只給顯示百分比用,不影響判定 sharp/flat feed display percentages only; the verdict is untouched
  const sharp = counted.filter(f => f.cents > SET.tolCents).length;
  const flat = counted.filter(f => f.cents < -SET.tolCents).length;
  const ratio = counted.length ? inTune / counted.length : 0;
  const enough = counted.length >= CONFIG.SING_MIN_COUNTED_FRAMES;
  return { counted: counted.length, inTune, sharp, flat, ratio, enough,
           pass: enough && ratio >= SET.ratio };
}

// 唱歌評量狀態機:等待起唱 -> 計算中(無時間上限) singing session: waiting for onset -> measuring (no time limit)
// feed(freq|null, tSec) once per analysis frame; result() at Stop
function createSingSession(targetHz){
  let onsetT = null, pending = [];
  const frames = [];
  function mk(freq, tSec){
    if(freq === null){ return { voiced: false, tAbs: tSec }; }
    const cents = 1200 * Math.log2(freq / targetHz);
    return { voiced: true, tAbs: tSec, cents: cents, hz: freq };
  }
  return {
    get phase(){ return onsetT === null ? 'waiting' : 'measuring'; },
    feed(freq, tSec){
      const f = mk(freq, tSec);
      if(onsetT === null){
        if(f.voiced){ pending.push(f); } else { pending = []; }   // 需連續有聲 must be consecutive
        if(pending.length >= CONFIG.SING_ONSET_FRAMES){
          onsetT = pending[0].tAbs;
          pending.forEach(p => { p.t = p.tAbs - onsetT; frames.push(p); });
          pending = [];
        }
      } else {
        f.t = f.tAbs - onsetT; frames.push(f);
      }
      return { phase: this.phase, cents: f.voiced ? f.cents : null, score: scoreFrames(frames, targetHz) };
    },
    result(){ return scoreFrames(frames, targetHz); },
    get frames(){ return frames; } // 給診斷報告的表現統計用 for the diagnostic report's performance stats
  };
}
function newDiagStats(){
  return { frames: 0, ok: 0, quiet: 0, unclear: 0, nopeak: 0, range: 0,
           firstSoundT: null, firstOkT: null, startT: null, endT: null,
           micLabel: '', micAec: null, micNs: null, micAgc: null, sampleRate: 0,
           practice: '', note: '', targetNote: '', perf: null, perfTolCents: 0, perfPass: null, perfRatio: null };
}
function diagAddFrame(st, info, tSec, gateRms){
  if(info.rms >= gateRms && st.firstSoundT === null){ st.firstSoundT = tSec; }
  if(st.firstSoundT === null){ return; } // 還沒收到聲音的準備時間不算進統計 preparation before any sound arrives is not data
  st.frames++; st.endT = tSec;
  if(st.startT === null){ st.startT = tSec; }
  const reason = info.reason || 'ok';
  if(reason === 'ok'){ st.ok++; if(st.firstOkT === null){ st.firstOkT = tSec; } }
  else if(reason === 'quiet'){ st.quiet++; }
  else if(reason === 'unclear'){ st.unclear++; }
  else if(reason === 'nopeak'){ st.nopeak++; }
  else { st.range++; }
}
function diagFindings(st){
  // 純邏輯:只回等級與發現 id,文字在 i18N;結論不超過量到的現象 pure logic: level + finding ids only, wording lives in i18n; conclusions never exceed the measured data
  if(st.frames < CONFIG.DIAG_MIN_FRAMES){ return { level: 'insufficient', findings: [] }; }
  const f = [];
  const quietPct = st.quiet / st.frames;
  if(quietPct > CONFIG.DIAG_QUIET_PCT){ f.push({ id: 'quiet', pct: Math.round(quietPct * 100) }); }
  const voiced = st.frames - st.quiet;
  if(voiced >= CONFIG.DIAG_MIN_FRAMES){
    const unclearPct = (st.unclear + st.nopeak) / voiced;
    if(unclearPct > CONFIG.DIAG_VOICE_PCT){ f.push({ id: 'unclear', pct: Math.round(unclearPct * 100) }); }
  }
  if(st.firstOkT !== null && st.firstOkT - st.firstSoundT > CONFIG.DIAG_REACT_SEC){
    f.push({ id: 'slow', sec: Math.round((st.firstOkT - st.firstSoundT) * 10) / 10 });
  }
  return { level: f.length ? 'warn' : 'ok', findings: f };
}
// 顯示用百分比各自四捨五入可能加起來 99 或 101(使用者回報 72+16+13=101);最大餘數法讓顯示值相加必為 100。畫面判定、即時百分比與報告都用同一套。原始幀數與判定完全不受影響 independent rounding can display 99/101 in total (user reported 72+16+13=101); largest-remainder keeps displayed shares summing to exactly 100. Shared by the on-screen verdict, the live percentage and the report. Raw counts and the pass verdict are untouched
function lrPcts(counts){
  const total = counts.reduce((a, b) => a + b, 0);
  if(!total){ return counts.map(() => 0); }
  const exact = counts.map(n => n / total * 100);
  const floors = exact.map(x => Math.floor(x));
  let leftover = 100 - floors.reduce((a, b) => a + b, 0);
  const order = exact.map((x, i) => [x - floors[i], i]).sort((a, b) => b[0] - a[0]);
  for(let k = 0; k < order.length && leftover > 0; k++, leftover--){ floors[order[k][1]]++; }
  return floors;
}
// 顯示整數與原始比例判定方向矛盾時(未過關但顯示值到達門檻,或過關但顯示值低於門檻),判定行改用一位小數,避免「70% 卻沒過關」看起來矛盾;門檻與判定不變 when the displayed integer contradicts the raw pass/fail (failed but displays at the threshold, or passed below it), the verdict line shows one decimal so the wording never looks contradictory; the threshold and verdict are unchanged
function verdictPctText(ratio, lrPct){
  const th = Math.round(SET.ratio * 100);
  const pass = ratio >= SET.ratio;
  if((pass && lrPct < th) || (!pass && lrPct >= th)){ return (Math.round(ratio * 1000) / 10).toFixed(1); }
  return String(lrPct);
}
function singPerfStats(frames){
  // 與 scoreFrames 同一個分母:有聲且跳過開頭穩定期的 frame;在內/偏高/偏低都用同一個容差帶 same denominator as scoreFrames: voiced frames after the settling window; in-tune/sharp/flat share the same tolerance band
  const voiced = frames.filter(f => f.voiced);
  const counted = voiced.filter(f => f.t >= CONFIG.SING_SETTLE_SEC);
  const inTune = counted.filter(f => Math.abs(f.cents) <= SET.tolCents).length;
  const sharp = counted.filter(f => f.cents > SET.tolCents).length;
  const flat = counted.filter(f => f.cents < -SET.tolCents).length;
  const pcts = lrPcts([inTune, sharp, flat]);
  const inTunePct = pcts[0], sharpPct = pcts[1], flatPct = pcts[2];
  return {
    voicedSec: Math.round(voiced.length * CONFIG.SING_FRAME_MS / 100) / 10,
    dropoutSec: Math.round((frames.length - voiced.length) * CONFIG.SING_FRAME_MS / 100) / 10,
    countedFrames: counted.length,
    inTunePct, sharpPct, flatPct,
    enough: counted.length >= CONFIG.SING_MIN_COUNTED_FRAMES
  };
}
function wrapTextToWidth(text, maxWidth, measure){
  // CJK 沒有空格,逐字元斷行;ASCII 單詞盡量整詞保留 no spaces in CJK: break per character; keep ASCII words whole
  const tokens = text.match(/[A-Za-z0-9+%.,:;/()\[\]#-]+|\s+|./g) || [];
  const lines = []; let cur = '';
  for(const tok of tokens){
    if(tok === '\n'){ if(cur){ lines.push(cur); cur=''; } continue; }
    const trial = cur + tok;
    if(cur && measure(trial) > maxWidth){
      if(/^\s+$/.test(tok)){ lines.push(cur); cur=''; continue; }
      lines.push(cur); cur = tok.replace(/^\s+/,'');
    } else { cur = trial; }
  }
  if(cur){ lines.push(cur); }
  return lines;
}

let singStarting = false;

async function prepMic(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showSingResult(false, t('singMicDenied'), '');
    return;
  }
  ensureCtx();
  if(ctx.state !== 'running'){ try{ await ctx.resume(); }catch(e){} }
  micPrepping = true; updateSingUI();
  try{
    singStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: CONFIG.SING_MIC_ECHO_CANCELLATION, noiseSuppression: CONFIG.SING_MIC_NOISE_SUPPRESSION, autoGainControl: CONFIG.SING_MIC_AUTO_GAIN }
    });
  }catch(err){
    micPrepping = false;
    showSingResult(false, (err && err.name === 'NotFoundError') ? t('singMicNone') : t('singMicDenied'), '');
    updateSingUI();
    return;
  }
  // v2.3: 等到真的收到聲音(peak>0)才算就緒;Safari 允許權限後要過一下才把麥克風接上,只等 getUserMedia resolve 會留下一段無聲窗口 only call it ready once real samples arrive (peak>0); Safari takes a moment to attach the mic after permission, so resolving getUserMedia alone leaves a dead window
  try{
    const src = ctx.createMediaStreamSource(singStream);
    const an = ctx.createAnalyser(); an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const deadline = performance.now() + 5000; // 最多等 5 秒,等不到也放行(可能是極安靜環境) give up after 5 s (very quiet room)
    while(performance.now() < deadline){
      an.getFloatTimeDomainData(buf);
      let peak = 0;
      for(let i = 0; i < buf.length; i++){ const a = Math.abs(buf[i]); if(a > peak){ peak = a; } }
      if(peak > 0){ break; }
      await new Promise(r => setTimeout(r, 100));
    }
    try{ src.disconnect(); }catch(e){}
  }catch(e){}
  micPrepping = false;
  // 開好先留著:閒置 60 秒自動關(與 stopSing 的保留邏輯一致) keep it open; auto-release after 60 s idle, same rule as stopSing
  if(singIdleTimer){ clearTimeout(singIdleTimer); }
  singIdleTimer = setTimeout(() => { releaseMic(); }, 60000);
  updateSingUI();
}
async function startSingInner(){

    const live = singStream && singStream.getAudioTracks().some(tr => tr.readyState === 'live');
    if(!live){
      singStream = await navigator.mediaDevices.getUserMedia({

      });

  if(refVoice){ try{ refVoice.stop(); }catch(e){} refVoice = null; }

  singMonitor = ctx.createGain();

  singTrace = []; singCentsNow = null;

  try{

      diagStats.micLabel = tr.label || '';
      const ms = tr.getSettings ? tr.getSettings() : {};
      diagStats.micAec = ms.echoCancellation; diagStats.micNs = ms.noiseSuppression; diagStats.micAgc = ms.autoGainControl;
    }
  }catch(e){}
  singStartMs = performance.now();
  state.singing = true;
  state.singLast = null;
  document.getElementById('singResult').classList.remove('show');

let singSmooth = (f) => f;
let diagStats = newDiagStats(); // 這次唱歌的診斷統計(只存在本機,不上傳) this session's diagnostic stats (local only, never uploaded)
function singTick(){
  if(!singSession || !singAnalyser){ return; }
  const tSec = (performance.now() - singStartMs) / 1000;
  singAnalyser.getFloatTimeDomainData(singBuf);
  const gateRms = CONFIG.SING_RMS_MIN;
  const freq = singSmooth(detectPitch(singBuf, ctx.sampleRate, singTarget * CONFIG.SING_SEARCH_LOW_RATIO, singTarget * CONFIG.SING_SEARCH_HIGH_RATIO, gateRms));
  diagAddFrame(diagStats, detectInfo, tSec, gateRms);
  const r = singSession.feed(freq, tSec);
  const live = document.getElementById('singLive');
  const bar = document.getElementById('singProgress');
  if(r.phase === 'waiting'){
    live.textContent = t('singLiveWaiting');
    bar.style.width = '0%';
  } else {
    let txt = t('singLiveListening');
    if(r.score.counted > 0){
      const pct = lrPcts([r.score.inTune, r.score.sharp, r.score.flat])[0]; // 與判定行、報告同一套顯示百分比 same display percentage as the verdict line and the report
      txt += ' · ' + t('singLivePct')(pct);
      bar.style.width = pct + '%';
    }
    live.textContent = txt;
  }
  singCentsNow = (freq && singTarget) ? 1200 * Math.log2(freq / singTarget) : null;
  // 畫面平滑(只影響線的顯示):取最近 N 個有聲 frame 的中位數;計分已在上面用原始音高;邊界處改用原始位置的校正在 drawPitch (boundary raw-position reconcile lives in drawPitch)
  let disp = singCentsNow;
  if(singCentsNow !== null && SET.smooth > 1){
    const win = [singCentsNow];
    for(let i = singTrace.length - 1; i >= 0 && win.length < SET.smooth; i--){ if(singTrace[i].c !== null){ win.push(singTrace[i].c); } }
    win.sort((a,b)=>a-b); disp = win[Math.floor(win.length/2)];
  }
  singTrace.push({ t: tSec, c: singCentsNow, d: disp });
  while(singTrace.length && singTrace[0].t < tSec - CONFIG.SING_TRACE_SEC){ singTrace.shift(); }
  drawPitch();
}

function applyLineVisibility(){
  document.getElementById('pitchWrap').style.display = state.showLine ? '' : 'none';

function drawPitch(){
  const cv = document.getElementById('pitchCanvas');
  if(!state.showLine || !cv){ return; }
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w){ return; }
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const tol = currentTolCents(); // 容差帶 = 判分容差 ±cent band = the scoring tolerance in cents
  const R = Math.max(CONFIG.SING_TRACE_MIN_VIEW, 1.2 * tol); // 畫面至少 ±100 cent,容差大時自動加寬 view at least ±100 cents, auto-widens for large tolerances
  const y = c => h/2 - Math.max(-R, Math.min(R, c)) / R * (h/2 - 8);
  g.fillStyle = 'rgba(47,191,170,0.12)';
  g.fillRect(0, y(tol), w, y(-tol) - y(tol));
  g.strokeStyle = 'rgba(47,191,170,0.45)'; g.lineWidth = 1; g.setLineDash([4,4]);
  [tol,-tol].forEach(c => { g.beginPath(); g.moveTo(0,y(c)); g.lineTo(w,y(c)); g.stroke(); });
  g.setLineDash([]);
  g.strokeStyle = 'rgba(234,242,241,0.85)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  g.fillStyle = 'rgba(234,242,241,0.55)'; g.font = '11px sans-serif';
  g.fillText('+' + R + ' ' + t('lineLabelSharp'), 6, 13);
  g.fillText('−' + R + ' ' + t('lineLabelFlat'), 6, h - 5);
  if(!state.singing || !singTrace.length){ return; }
  const tNow = singTrace[singTrace.length-1].t;
  const x = tt => w - (tNow - tt) / CONFIG.SING_TRACE_SEC * w;
  // 顯示與計分一致:平滑值把點拉到邊界另一側時(與原始值的帶內/帶外不同),該點改用原始值畫;綠色永遠對應帶內、計分永遠用原始值 display stays score-honest: if smoothing pulls a point to the other side of the band edge from its raw value, plot the raw value for that point — green always means inside the band, scoring always uses raw frames
  const yd = p => y((Math.abs(p.c) <= tol) === (Math.abs(p.d) <= tol) ? p.d : p.c);
  g.lineWidth = 3; g.lineCap = 'round';
  const yTop = y(tol), yBot = y(-tol); // y 軸向下:yTop 是上緣、yBot 是下緣 y axis points down: yTop is the upper edge
  for(let i = 1; i < singTrace.length; i++){
    const a = singTrace[i-1], b = singTrace[i];
    if(a.c === null || b.c === null){ continue; }
    const x0 = x(a.t), y0 = yd(a), x1 = x(b.t), y1 = yd(b);
    // 線段在邊界處切開,每段依自身幾何位置著色:綠色必在帶內、琥珀色必在帶外;端點經上面的校正,永遠與計分一致 split the segment at band-edge crossings and color each piece by its own geometry: green is always inside the band, amber always outside; endpoints are reconciled above, so they always agree with the raw-value scoring
    const cuts = [0, 1];
    [yTop, yBot].forEach(ye => { if((y0 - ye) * (y1 - ye) < 0){ cuts.push((ye - y0) / (y1 - y0)); } });
    cuts.sort((p, q) => p - q);
    for(let k = 0; k < cuts.length - 1; k++){
      const t0 = cuts[k], t1 = cuts[k + 1], tm = (t0 + t1) / 2;
      const ym = y0 + (y1 - y0) * tm;
      g.strokeStyle = (ym >= yTop && ym <= yBot) ? '#4cd964' : '#e8a33d';
      g.beginPath(); g.moveTo(x0 + (x1 - x0) * t0, y0 + (y1 - y0) * t0); g.lineTo(x0 + (x1 - x0) * t1, y0 + (y1 - y0) * t1); g.stroke();
    }
  }
}

// 報告內容模型:HTML/PDF 都從這裡出,文字只有一份 single content model so wording lives in one place
function buildDiagModel(){
  const st = diagStats, r = diagFindings(st);
  const pad2 = (n) => String(n).padStart(2,'0');
  const now = new Date();
  const dateStr = now.getFullYear() + '-' + pad2(now.getMonth()+1) + '-' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  const fKey = { quiet: 'repFindQuiet', unclear: 'repFindUnclear', slow: 'repFindSlow' };
  const aKey = { quiet: 'repAdvQuiet', unclear: 'repAdvUnclear', slow: 'repAdvSlow' };
  let okObservation = null;
  if(!r.findings.length && r.level === 'ok' && st.frames > 0){
    const voicedN = st.frames - st.quiet;
    const qpct = Math.round(st.quiet / st.frames * 100);
    const upct = voicedN ? Math.round((st.unclear + st.nopeak) / voicedN * 100) : 0;
    okObservation = t('repOkObs')(qpct, upct);
  }
  let perf = null;
  if(st.perf){
    const p = st.perf, lines = [];
    let verdict = null;
    if(p.enough){
      // 報告內部一致:判定行的百分比用與統計行同一個最大餘數法整數,過關與否仍看原始比例;邊界情況與畫面同一條 verdictPctText 規則 report-internal consistency: verdict pct reuses the same largest-remainder integer as the stats line; pass/fail still comes from the raw ratio; the boundary rule is the same verdictPctText the screen uses
      if(st.perfPass === true || st.perfPass === false){
        const pctText = (st.perfRatio === null || st.perfRatio === undefined) ? String(p.inTunePct) : verdictPctText(st.perfRatio, p.inTunePct);
        verdict = { text: t(st.perfPass ? 'repVerdictPass' : 'repVerdictFail')(pctText, st.perfTolCents), pass: st.perfPass };
      }
      lines.push(t('repVoicedSec')(p.voicedSec));
      lines.push(t('repAcc')(p.inTunePct, p.sharpPct, p.flatPct, st.perfTolCents));
      if(p.dropoutSec > 0.4){ lines.push(t('repDropout')(p.dropoutSec)); }
      // 練習建議的門檻是猜的(85% 算穩、偏高/偏低差 15 個百分點算明顯、60% 以下建議放慢) thresholds are guesses, conservative tips only
      const tipKey = p.inTunePct >= 85 ? 'repPerfGood' : (p.sharpPct >= p.flatPct + 15 ? 'repPerfSharp' : (p.flatPct >= p.sharpPct + 15 ? 'repPerfFlat' : (p.inTunePct < 60 ? 'repPerfLow' : null)));
      if(tipKey){ lines.push(t(tipKey)); }
    } else {
      lines.push(t('repTooShort'));
    }
    perf = { heading: t('repSecPerf'), verdict, lines };
  }
  const dur = (st.startT !== null && st.endT !== null) ? Math.round((st.endT - st.startT) * 10) / 10 : 0;
  const pc = (n) => st.frames ? Math.round(n / st.frames * 100) : 0;
  const rows = [t('repD1')(dur), t('repD2')(pc(st.ok), pc(st.quiet), pc(st.unclear + st.nopeak))];
  if(st.micLabel){ rows.push(t('repD3')(st.micLabel)); }
  if(st.micAec !== null && st.micAec !== undefined){ rows.push(t('repD4')(st.micAec, st.micNs, st.micAgc)); }
  if(st.sampleRate){ rows.push(t('repD5')(st.sampleRate)); }
  return {
    title: t('repTitle'), dateStr, version: CONFIG.APP_VERSION,
    ctxLine: t('repCtx')(st.practice ? t('prac')[st.practice].short : '-', st.note || '-', st.targetNote || '-'),
    level: r.level,
    conclusion: r.level === 'ok' ? t('repOk') : r.level === 'insufficient' ? t('repInsufficient') : t('repWarn'),
    captureHeading: t('repSecCapture'),
    findHeading: t('repHeadFind'), advHeading: t('repHeadAdv'),
    findings: r.findings.map(f => ({ id: f.id, text: t(fKey[f.id])(f.pct !== undefined ? f.pct : f.sec) })),
    advices: r.findings.map(f => t(aKey[f.id])),
    okObservation,
    uncertainty: r.findings.length ? t('repUncertainty') : null,
    perf,
    details: { heading: t('repHeadDetails'), rows, note: t('repDetailNote') },
    footer: t('repFoot')
  };
}
function buildDiagPdf(model){
  const jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  const doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
  doc.addFileToVFS('NotoSansTC-Regular.ttf', DIAG_FONT_REG_B64);
  doc.addFont('NotoSansTC-Regular.ttf', 'NotoTC', 'normal');
  doc.addFileToVFS('NotoSansTC-Bold.ttf', DIAG_FONT_BOLD_B64);
  doc.addFont('NotoSansTC-Bold.ttf', 'NotoTC', 'bold');
  const PW = 595.28, M = 42, CW = PW - 2 * M;
  let y = 56;
  const need = (h) => { if(y + h > 800){ doc.addPage(); y = 56; } };
  const para = (text, o) => {
    o = Object.assign({ bold: false, size: 10.5, color: [29,35,41], gap: 5, indent: 0 }, o || {});
    doc.setFont('NotoTC', o.bold ? 'bold' : 'normal'); doc.setFontSize(o.size); doc.setTextColor(o.color[0], o.color[1], o.color[2]);
    const lines = wrapTextToWidth(text, CW - o.indent, (x) => doc.getTextWidth(x));
    const lh = o.size * 1.45;
    for(const line of lines){ need(lh); doc.text(line, M + o.indent, y); y += lh; }
    y += o.gap;
  };
  const h2 = (txt) => { y += 10; para(txt, { bold: true, size: 12.5, gap: 4 }); };
  doc.setFont('NotoTC', 'bold'); doc.setFontSize(17); doc.setTextColor(29,35,41); doc.text(model.title, M, y); y += 20;
  para(model.ctxLine + ' \u00b7 ' + model.dateStr + ' \u00b7 ' + model.version, { size: 9, color: [106,116,124], gap: 10 });
  const vc = model.level === 'ok' ? { bg: [227,245,236], fg: [26,127,77] } : model.level === 'warn' ? { bg: [253,240,221], fg: [154,91,0] } : { bg: [236,239,241], fg: [90,100,108] };
  doc.setFont('NotoTC', 'bold'); doc.setFontSize(12);
  const vlines = wrapTextToWidth(model.conclusion, CW - 24, (x) => doc.getTextWidth(x));
  const vh = vlines.length * 17 + 14;
  doc.setFillColor(vc.bg[0], vc.bg[1], vc.bg[2]); doc.roundedRect(M, y - 12, CW, vh, 8, 8, 'F');
  doc.setTextColor(vc.fg[0], vc.fg[1], vc.fg[2]);
  let vy = y + 5;
  for(const l of vlines){ doc.text(l, M + 12, vy); vy += 17; }
  y += vh + 4;
  if(model.findings.length || model.okObservation){ h2(model.captureHeading); }
  if(model.findings.length){
    para(model.findHeading, { bold: true, size: 11, gap: 3 });
    model.findings.forEach(f => para('\u2022 ' + f.text, { indent: 10, gap: 3 }));
    y += 4;
    para(model.advHeading, { bold: true, size: 11, gap: 3 });
    model.advices.forEach(a => para('\u2022 ' + a, { indent: 10, gap: 3 }));
    y += 2;
    para(model.uncertainty, { size: 8.5, color: [106,116,124], gap: 4 });
  } else if(model.okObservation){ para(model.okObservation, { gap: 4 }); }
  if(model.perf){
    h2(model.perf.heading);
    if(model.perf.verdict){
      para(model.perf.verdict.text, { bold: true, size: 11, color: model.perf.verdict.pass ? [26,127,77] : [154,91,0], gap: 4 });
    }
    model.perf.lines.forEach(l => para(l, { gap: 4 }));
  }
  y += 6;
  para(model.details.heading, { bold: true, size: 11, color: [60,69,77], gap: 3 });
  model.details.rows.forEach(r => para('\u2022 ' + r, { size: 9, color: [60,69,77], indent: 10, gap: 2 }));
  para(model.details.note, { size: 8.5, color: [106,116,124], gap: 6 });
  doc.setFont('NotoTC', 'normal'); doc.setFontSize(8.5); doc.setTextColor(106,116,124);
  doc.text(model.footer, PW / 2, 820, { align: 'center' });
  return doc.output('blob');
}
function downloadDiagReport(){
  const blob = buildDiagPdf(buildDiagModel());
  const a = document.createElement('a');
  const d = new Date(), pad2 = (n) => String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = 'tune-to-pure-diagnostic-' + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  const b = document.getElementById('btnDiagReport');
  b.textContent = t('repDownloaded');
  setTimeout(() => { b.textContent = t('repBtn'); }, 1500);
}
function finishSing(){
  const result = singSession ? singSession.result() : scoreFrames([], singTarget || 440);
  diagStats.perf = singSession ? singPerfStats(singSession.frames) : null; // 用按停止當下的容差算,和判定同一刻 captured with the tolerance at Stop, the same moment as the verdict
  diagStats.perfTolCents = SET.tolCents;
  diagStats.perfPass = (singSession && result.enough) ? result.pass : null; // 與畫面判定同一個 result pass/fail from the same result as the on-screen verdict
  diagStats.perfRatio = (singSession && result.enough) ? result.ratio : null; // 邊界措辭用 for boundary wording in the verdict line
  stopSing(true);
  state.singLast = result;
  renderSingResult(result);
  updateSingUI();
}

function renderSingResult(result){
  // 顯示百分比與報告同一套(最大餘數法);邊界情況 verdictPctText 補一位小數 display percentage is the same largest-remainder value the report uses; verdictPctText adds one decimal at the threshold boundary
  const pctText = verdictPctText(result.ratio, lrPcts([result.inTune, result.sharp, result.flat])[0]);
  if(!result.enough){ showSingResult(false, t('singNoVoice'), ''); }
  else if(result.pass){ showSingResult(true, t('singPass')(pctText), ''); }
  else { showSingResult(false, t('singFail')(pctText), ''); }
}

function showSingResult(ok, verdict, detail){
  const vEl = document.getElementById('singVerdict');
  vEl.textContent = verdict;
  vEl.classList.toggle('ok', !!ok);
  document.getElementById('singDetail').textContent = detail;
  document.getElementById('singResult').classList.add('show');
}

function releaseMic(){
  if(singIdleTimer){ clearTimeout(singIdleTimer); singIdleTimer = null; }
  if(singStream){ singStream.getTracks().forEach(tr => tr.stop()); singStream = null; }
  micPrepping = false;
  if(typeof updateSingUI === 'function' && document.getElementById('btnSing')){ updateSingUI(); } // v2.3: 麥克風關掉後按鈕回到「開啟麥克風」 button reverts to mic-open step
}
document.addEventListener('visibilitychange', () => { if(document.hidden && !state.singing){ releaseMic(); } });
function stopSing(keepMic){
  if(singTimer){ clearInterval(singTimer); singTimer = null; }
  if(singIdleTimer){ clearTimeout(singIdleTimer); singIdleTimer = null; }
  if(singStream){
    if(keepMic){ singIdleTimer = setTimeout(releaseMic, 60000); } // 閒置 60 秒後關麥克風 release mic after 60 s idle
    else { releaseMic(); }
  }
  if(singSource){ try{ singSource.disconnect(); }catch(e){} singSource = null; }
  if(singMonitor){ try{ singMonitor.disconnect(); }catch(e){} singMonitor = null; }
  singAnalyser = null;
  if(refVoice && ctx){
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0, now + CONFIG.FADE_SEC);
    const rv = refVoice;
    setTimeout(() => rv.stop(), CONFIG.FADE_SEC * 1000 + 50);
    refVoice = null;
  }
  state.singing = false;
  state.playing = false;
  singTrace = []; singCentsNow = null;
  drawPitch();
}

function updateSingUI(){
  const b = document.getElementById('btnSing');
  const live = micLive();
  // v2.3: 按鈕三態:開啟麥克風 → (準備中) → 開始唱 → 停止 three button states: open mic -> (preparing) -> start -> stop
  if(state.singing){ b.textContent = t('singStop'); b.className = 'btn btn-stop'; }
  else if(micPrepping){ b.textContent = t('micPrep'); b.className = 'btn btn-primary'; }
  else if(live){ b.textContent = t('singStart'); b.className = 'btn btn-primary'; }
  else { b.textContent = t('micOpen'); b.className = 'btn btn-primary'; }
  document.getElementById('singDot').className = 'dot' + ((state.singing || live) ? ' ok' : ''); // 綠點:麥克風就緒或評量中 green dot = mic ready or measuring
  if(!state.singing){
    document.getElementById('singLive').textContent = micPrepping ? t('micPrep') : (live ? t('singLiveReady') : t('singLiveNeedMic'));
    if(!state.singLast){ document.getElementById('singProgress').style.width = '0%'; }
  }
}

/* ================= UI BUILD ================= */
const octToggle = document.getElementById('octToggle');
const keyGrid = document.getElementById('keyGrid');
const octKeys = ['octLow','octMid','octHigh'];
const octSubKeys = ['octLowSub','octMidSub','octHighSub'];

function buildPickers(){
  octToggle.innerHTML = '';
  CONFIG.OCTAVES.forEach((oct, i) => {
    const b = document.createElement('button');
    b.className = 'oct-btn' + (i === state.octaveIdx ? ' active' : '');
    b.innerHTML = `${t(octKeys[i])}<small>${t(octSubKeys[i])}</small>`;
    b.onclick = () => {
      state.octaveIdx = i;
      buildPickers();
      newRound();
    };
    octToggle.appendChild(b);
  });
  keyGrid.innerHTML = '';
  const curOct = CONFIG.OCTAVES[state.octaveIdx];
  const noteCap = (CONFIG.OCTAVE_NOTE_CAP && CONFIG.OCTAVE_NOTE_CAP[curOct] !== undefined) ? CONFIG.OCTAVE_NOTE_CAP[curOct] : NOTE_NAMES.length - 1;
  if(state.noteIdx > noteCap){ state.noteIdx = noteCap; } // 切到部分八度時,把選中的音收回範圍內 clamp selection into a partial octave
  NOTE_NAMES.slice(0, noteCap + 1).forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'key-btn' + (i === state.noteIdx ? ' active' : '');
    b.textContent = name;
    b.onclick = () => {
      state.noteIdx = i;
      buildPickers();
      newRound();
    };
    keyGrid.appendChild(b);
  });
}

function updateTransport(){
  document.getElementById('btnPlay').textContent = state.playing ? t('stop') : t('play');
  document.getElementById('btnPlay').className = 'btn ' + (state.playing ? 'btn-stop' : 'btn-primary');
  document.getElementById('statusDot').className = 'dot' + (state.playing ? ' ok' : '');
  document.getElementById('statusText').textContent = state.playing ? t('statusOn') : t('statusOff');
  if(state.phase === 'tune'){
    document.getElementById('btnConfirm').disabled = !state.playing;
  }
}


/* ===== 進階設定 advanced settings ===== */
function setupAdv(){
  const set=(id,min,max,step)=>{const e=document.getElementById(id);e.min=min;e.max=max;e.step=step;};
  set('advRange',CONFIG.SING_TOLC_MIN,CONFIG.SING_TOLC_MAX,CONFIG.SING_TOLC_STEP);
  set('advRatio',Math.round(CONFIG.SING_RATIO_MIN*100),Math.round(CONFIG.SING_RATIO_MAX*100),Math.round(CONFIG.SING_RATIO_STEP*100));
  syncAdv();
}
function syncAdv(){
  document.getElementById('advRange').value=SET.tolCents;
  document.getElementById('advRatio').value=Math.round(SET.ratio*100);
  document.getElementById('advRangeV').textContent='±'+SET.tolCents+' cent';
  document.getElementById('advRatioV').textContent=Math.round(SET.ratio*100)+'%';
  const sel=document.getElementById('advSmooth');
  sel.innerHTML='';
  CONFIG.SING_SMOOTH_OPTIONS.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n===1?t('advSmoothOff'):t('advSmoothN')(n);sel.appendChild(o);});
  sel.value=SET.smooth;
}
function onAdv(){
  SET.tolCents=+document.getElementById('advRange').value;
  SET.smooth=+document.getElementById('advSmooth').value;
  SET.ratio=+document.getElementById('advRatio').value/100;
  refreshSettingTexts();
}
function resetAdv(){
  SET.tolCents=CONFIG.SING_TOLERANCE_CENTS; SET.smooth=CONFIG.SING_SMOOTH_DEFAULT; SET.ratio=CONFIG.SING_PASS_RATIO;
  refreshSettingTexts();
}
function refreshSettingTexts(){
  document.getElementById('txtSingInstruction').textContent=t('singInstruction');
  syncAdv();
  drawPitch();
}

function applyLang(){
  document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('title');
  document.getElementById('txtEyebrow').textContent = t('eyebrow');
  document.getElementById('txtH1').textContent = t('h1');
  document.getElementById('txtPickTitle').textContent = t('pickTitle');
  document.getElementById('btnConfirm').textContent = t('confirm');
  document.getElementById('btnNext').textContent = t('next');
  document.getElementById('btnAbYours').textContent = t('abYours');
  document.getElementById('btnAbCorrect').textContent = t('abCorrect');
  document.getElementById('btnModeSlider').textContent = t('modeSlider');
  document.getElementById('btnModeSing').textContent = t('modeSing');
  document.getElementById('txtPracTitle').textContent = t('pracTitle');
  document.getElementById('btnPracUnison').innerHTML = t('pracUnison');
  document.getElementById('btnPracOctave').innerHTML = t('pracOctave');
  document.getElementById('btnPracFifth').innerHTML = t('pracFifth');
  document.getElementById('btnPracFourth').innerHTML = t('pracFourth');
  updatePracticeUI();
  document.getElementById('txtSingInstruction').textContent = t('singInstruction');
  ['advTitle','advNote','advReset'].forEach(k=>document.getElementById(k).textContent=t(k));
  document.getElementById('advRangeL').textContent=t('advRange');
  document.getElementById('advSmoothL').textContent=t('advSmooth');
  document.getElementById('advRatioL').textContent=t('advRatio');
  syncAdv();
  document.getElementById('txtLineToggle').textContent = t('lineToggle');
  document.getElementById('chkLine').checked = state.showLine;
  document.getElementById('btnDiagReport').textContent = t('repBtn');
  applyLineVisibility();
  updateSingUI();
  if(state.singLast){ renderSingResult(state.singLast); }
  document.getElementById('txtFooter1').textContent = t('footerLine1');
  document.getElementById('txtFooter2').textContent = t('footerLine2');
  document.getElementById('txtVersionPrefix').textContent = t('versionPrefix');
  document.getElementById('btnLang').textContent = t('langBtn');
  buildPickers();
  updateTransport();
  if(state.phase === 'revealed'){
    // 重新渲染揭曉文字 re-render revealed text in new language
    const c = state.answerCents, ac = Math.abs(c);
    const ok = ac <= CONFIG.TOLERANCE_CENTS;
    const vEl = document.getElementById('verdictText');
    const dEl = document.getElementById('detailText');
    if(ok){
      vEl.textContent = t('verdictOk');
      dEl.textContent = t('detailOk')(ac.toFixed(1));
    } else {
      vEl.textContent = (c > 0 ? t('verdictHigh') : t('verdictLow'));
      dEl.textContent = t('detailCents')(ac.toFixed(1));
    }
  }
}
function toggleLang(){
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  applyLang();
}

setupAdv();
applyLang();
newRound();
</script>
